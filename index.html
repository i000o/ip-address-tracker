<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="dist/output.css"> 
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
   <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/script.js"></script>
  <title>IP Address Tracker</title>
</head>
<body class="font-[Rubik]">
  <main class="relative md:flex md:flex-col md:min-h-screen"> 
    <div class="30vh">
      <picture>
        <source media="(min-width: 768px)" srcset="images/pattern-bg-desktop.png">
        <img src="images/pattern-bg-mobile.png" alt="pattern-background" class="w-full h-[20em] object-cover l:max-h-[50%]">
      </picture>
    </div>
    <div class="content-wrapper flex flex-col justify-start text-center items-center absolute inset-0 z-10 pointer-events-none"> <!-- content wrapper-->
      <h1 class="text-white font-normal m-5 text-[1.4em] pointer-events-auto">IP Address Tracker</h1>
      <form class="input-wrapper flex flex-row h-[40px] min-w-[20em] mb-5 pointer-events-auto" id="form"> <!-- input field wrapper--> 
        <input type="text" class="bg-white rounded-xl pt-1 pb-1 flex-1 rounded-r-none pl-5 placeholder:text-[0.9em] md:w-[400px]" id="IPInput" placeholder="Search for any IP Address or domain"> <!-- do you want the placeholder text? -->
        <button type="submit" id="submit"> <!-- submit button -->
          <img src="images/icon-arrow.svg" alt="arrow-icon" class="bg-black rounded-xl rounded-l-none p-[14px]">
        </button>
      </form>
      <ol class="bg-white rounded-2xl p-5 min-w-[20em] pointer-events-auto md:flex md:flex-row md:w-[90%] md:ml-20 md:mr-20 md:text-left md:justify-evenly">
        <li id="ip-item"> 
          <p>IP Address</p>
          <span id="ip-display"></span>
        </li>
        <li id="location-item"> 
          <p>Location</p>
          <span id="location-display"></span>
        </li>
        <li id="timezone-item"> 
          <p>Timezone</p>
          <span id="timezone-display"></span>
        </li>
        <li id="isp-item"> 
          <p>ISP</p>
          <span id="isp-display"></span>
        </li>
      </ol>
      <span class="error bg-white rounded-xl min-w-[20em] m-10 text-inherit text-[0.8em] hidden" id="error-span"></span>
    </div>
    <div id="map" class="h-[500px] z-0 md:flex-1"></div>
  </main>
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
